<mat-sidenav-container class="app-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">admin_panel_settings</mat-icon>
      <span class="logo-text">SSEI</span>
      <span class="toolbar-spacer"></span>


    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>space_dashboard</mat-icon>
        <span matListItemTitle>Tablero</span>
      </a>
      <a mat-list-item routerLink="/ots" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}">
        <mat-icon matListItemIcon>add_box</mat-icon>
        <span matListItemTitle>Generar Trabajo</span>
      </a>
    </mat-nav-list>
    <mat-nav-list>
      <a mat-list-item>
        <mat-icon matListItemIcon>book</mat-icon>
        <span matListItemTitle>Biblioteca</span>
      </a>
    </mat-nav-list>
    <mat-nav-list>
      <a mat-list-item>
        <mat-icon matListItemIcon>download</mat-icon>
        <span matListItemTitle>Generar Informe</span>
      </a>
    </mat-nav-list>
    <mat-nav-list>
      <a mat-list-item>
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Configuración</span>
      </a>
    </mat-nav-list>

    <mat-nav-list class="user-info-list" style="margin-top: auto;">
      <div class="user-info">
        <mat-icon class="user-icon">account_circle</mat-icon>
      </div>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="main-toolbar">
      <span>{{ title() }}</span>
      <span class="toolbar-spacer"></span>
      <a mat-stroked-button routerLink="/ots/nueva" color="accent" class="nueva-ot-btn">
        <mat-icon>add</mat-icon> Nueva OT
      </a>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
