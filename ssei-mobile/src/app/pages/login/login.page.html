<ion-content [fullscreen]="true" class="login-content">
  <div class="login-shell">
    <div class="logo-box">
      <h1 class="logo" title="SSEI">SSEI</h1>
      <p>Sistema de seguimiento de trabajos </p>
    </div>

    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-label position="stacked">Correo Institucional</ion-label>
          <ion-input
            type="email"
            placeholder="ejemplo@ssei.cl"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-button expand="block" (click)="onLogin()" [disabled]="isLoading">
          {{ isLoading ? 'Conectando...' : 'Continuar con Google Workspace' }}
        </ion-button>

        <ion-button fill="clear" size="small" expand="block">
          ¿Problemas para ingresar? Contactar Soporte IT
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
