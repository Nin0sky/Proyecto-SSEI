<ion-content [fullscreen]="true" class="login-content">
  <div class="login-shell">
    <div class="logo-box">
      <h1 class="logo" title="SSEI">SSEI</h1>
      <img src="assets/icon/ssei.ico" class="logo-image" />
      <p>Sistema de seguimiento de trabajos </p>
    </div>

    <ion-card class="login-card">
      <ion-card-content class="login-card-content">
        <ion-item lines="outline">
          <ion-label position="stacked">Correo Institucional</ion-label>
            <ion-input type="email" placeholder="ejemplo@ssei.cl" [(ngModel)]="email">
              <ion-icon name="mail-outline" slot="start"></ion-icon>
          </ion-input>
        </ion-item>
        <ion-item lines="outline">
          <ion-label position="stacked">Contraseña</ion-label>
            <ion-input type="password" placeholder="********">
              <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          </ion-input>
        </ion-item>

        <ion-button expand="block" (click)="onLogin()" [disabled]="isLoading">
          <ion-icon slot="start" name="arrow-forward-outline"></ion-icon>
          {{ isLoading ? 'Conectando...' : 'Ingresar' }}    
        </ion-button>

        <ion-button fill="clear" size="small" expand="block">
          ¿Problemas para ingresar? Contactar Soporte IT
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
