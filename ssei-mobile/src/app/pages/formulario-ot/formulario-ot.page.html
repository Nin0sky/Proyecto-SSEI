<option value="desanclaje">Desanclaje</option>
<option value="mantenimiento">Mantenimiento</option>

</select>
</div>
<div class="col-span-4 flex flex-col gap-unit-1">
<label class="font-label-md text-label-md text-on-surface-variant text-center">Cantidad</label>
<div class="flex h-unit-12 items-center border border-outline-variant rounded-lg bg-surface overflow-hidden">
<button class="flex-1 h-full hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="decrement(this)">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<input class="w-10 text-center border-none bg-transparent font-label-lg focus:ring-0 p-0" min="1" readonly="" type="number" value="1">

<span class="material-symbols-outlined text-[20px]">add</span>
</button>

</div>
</div>
</div>

                </button>

<script>
        function increment(btn) {
            const input = btn.parentNode.querySelector('input');
            input.value = parseInt(input.value) + 1;
        }

        function decrement(btn) {
            const input = btn.parentNode.querySelector('input');
            if (parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(5);
                }
            });
        });
    </script>
