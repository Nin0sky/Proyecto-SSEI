<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Registro OT - Ubicación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="page-content">
  <section class="section">
    <h2>Información del Punto de Atención</h2>
    <p>Complete los datos de ubicación para iniciar la OT.</p>
  </section>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Seleccionar Cliente</ion-label>
        <ion-select [(ngModel)]="cliente" interface="popover" placeholder="Elija un cliente">
          <ion-select-option value="Banco de Chile">Banco de Chile</ion-select-option>
          <ion-select-option value="Loomis">Loomis</ion-select-option>
          <ion-select-option value="Santander">Santander</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">ID Maestro del ATM</ion-label>
        <ion-input [(ngModel)]="atmId" (ionInput)="onAtmInput()" placeholder="Ej: 6122"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Comuna</ion-label>
        <ion-input [value]="comuna" readonly="true"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Dirección</ion-label>
        <ion-input [value]="direccion" readonly="true"></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" [routerLink]="['/formulario-ot']">
    Siguiente: Registrar Servicios
  </ion-button>
</ion-content>
